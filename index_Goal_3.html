<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color:rgb(240, 219, 187);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            padding:auto;
            gap: 20px;
            margin: 10px 10px;
        

        }
        .green-bar {
            background-color: rgb(135, 219, 135);
            width: 100%;  
            padding: auto;
            color: white;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 3rem;
            font-weight: bold;
            
        }
        .brown-bar {
            background-color: rgb(211, 130, 37);
            width: 100%;
            padding:auto;
            color: white;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 2rem;
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <div class="green-bar">Hello</div>
    <div class="brown-bar">World</div> 

</body>
</html>
