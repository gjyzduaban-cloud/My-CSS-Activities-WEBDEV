<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Important CSS Properties</title>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #5b8fd6;
    color: white;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 40px;
    margin: 0;
    height: 100vh;
    box-sizing: border-box;
  }

  h1 {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .color-label {
    color: #e8836b;
    font-size: 20px;
    margin-bottom: 40px;
  }

  .font-size-label {
    font-size: 48px;
    font-weight: normal;
    margin-bottom: 60px;
  }

  .font-weight-label {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 15px;
  }

  .font-family-label {
    font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
    font-size: 22px;
    margin-bottom: 40px;
  }

  .text-align-label {
    font-size: 16px;
    text-align: right;
  }
</style>
</head>
<body>

  <h1>Important CSS Properties</h1>
  <div class="color-label">Color</div>
  <div class="font-size-label">Font Size</div>
  <div class="font-weight-label">Font Weight</div>
  <div class="font-family-label">Font Family</div>
  <div class="text-align-label">Text Align</div>

</body>
</html>
