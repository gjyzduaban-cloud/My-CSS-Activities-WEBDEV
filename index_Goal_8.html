<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rectangle with Circle</title>
<style>
  body {
    background-color: white;
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .canvas {
    position: relative;
    width: 900px;
    height: 700px;
  }
  .rectangle {
    position: absolute;
    top: 200px;
    left: 200px;
    width: 500px;
    height: 300px;
    background-color: #1414f0;
  }
  .circle {
    position: absolute;
    top: 150px;
    left: 250px;
    width: 170px;
    height: 170px;
    background-color: red;
    border-radius: 50%;
  }
</style>
</head>
<body>

  <div class="canvas">
    <div class="rectangle">
      <div class="circle"></div>
    </div>
  </div>

</body>
</html>
