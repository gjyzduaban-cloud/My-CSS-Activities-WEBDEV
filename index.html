<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Activities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Poppins', Georgia, serif;
      color: #fff;
      display: flex; flex-direction: column; justify-content: center;
      gap: clamp(14px, 3vh, 32px);
      overflow: hidden;
      background: linear-gradient(125deg, #1a1446, #4b2fd1, #c13ea8, #ff7a59, #4b2fd1, #1a1446);
      background-size: 400% 400%;
      animation: flow 22s ease-in-out infinite;
    }
    body::before { /* soft glow shapes */
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.14), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: auto, auto, 26px 26px;
    }
    @keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    header { position: relative; text-align: center; padding: 0 20px; }
    .eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
    h1 { font-size: clamp(2rem, 6.5vw, 3.6rem); line-height: 1.1; margin-top: 6px; }

    /* ---------- Flex carousel (scrolls with the mouse wheel) ---------- */
    .viewport {
      position: relative;
      display: flex; align-items: center;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 30px 0 40px;
    }
    .viewport::-webkit-scrollbar { display: none; }

    .track {
      --w: clamp(280px, 80vw, 440px);
      display: flex; flex: none;
      gap: clamp(16px, 3vw, 36px);
      padding-inline: calc(50vw - var(--w) / 2);
    }

    .card {
      flex: 0 0 var(--w);
      height: clamp(380px, 58vh, 540px);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(22px, 3vw, 32px);
      border-radius: 32px;
      text-decoration: none; color: #fff;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow: 0 30px 60px rgba(10, 6, 40, .35);
      transform: scale(var(--s, .85));
      opacity: var(--o, .6);
      will-change: transform, opacity;
    }
    .card::before, .card::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); }
    .card::before { width: 70%; aspect-ratio: 1; top: -22%; right: -22%; }
    .card::after  { width: 40%; aspect-ratio: 1; bottom: -12%; left: 8%; background: rgba(255,255,255,.1); }

    .badge {
      position: relative; align-self: flex-start; z-index: 1;
      background: rgba(255,255,255,.25); backdrop-filter: blur(6px);
      padding: 6px 16px; border-radius: 999px; font-size: .8rem; font-weight: 600;
    }
    .num {
      position: relative; z-index: 1;
      font-size: clamp(5rem, 14vw, 8rem); font-weight: 700; line-height: 1;
      color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.85);
    }
    .info { position: relative; z-index: 1; }
    .info h2 { font-size: clamp(1.4rem, 3.2vw, 1.9rem); line-height: 1.2; }
    .info p { margin-top: 8px; font-size: clamp(.9rem, 2vw, 1rem); opacity: .88; }

    .status {
      position: relative; text-align: center;
      font-size: .85rem; letter-spacing: .12em; opacity: .85;
    }
    .status b { font-size: 1.1rem; }
    .bar { width: min(260px, 60vw); height: 4px; margin: 10px auto 0; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) { body { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Course Portfolio</div>
    <h1>My CSS Activities</h1>
  </header>

  <main class="viewport" id="viewport" aria-label="CSS activities">
    <div class="track" id="track"></div>
  </main>

  <div class="status">
    <span><b id="current">01</b> / <span id="total">11</span> &nbsp;·&nbsp; scroll to explore</span>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <script>
    // ----- Data: Goals 1 to 11, each connected to its file -----
    const goals = [
      { title: "Three Methods of Adding CSS",   desc: "Inline, internal and external styling.",          href: "index_Goal_1.html",  c1: "#6c4cf1", c2: "#a78bfa" },
      { title: "CSS Selectors",                 desc: "Applying CSS to different parts of HTML.",        href: "index_Goal_2.html",  c1: "#ff6a4d", c2: "#ffb199" },
      { title: "Hello World Bars",              desc: "Green and brown bars built with flexbox.",        href: "index_Goal_3.html",  c1: "#0f9d6e", c2: "#6ee7b7" },
      { title: "Important CSS Properties",      desc: "Color, font size, weight, family and alignment.", href: "index_Goal_4.html",  c1: "#2563eb", c2: "#7dd3fc" },
      { title: "Box Model Diagram",             desc: "Margin, border and padding in action.",           href: "index_Goal_5.html",  c1: "#f59e0b", c2: "#fde047" },
      { title: "Nested Padding Diagram",        desc: "Boxes inside boxes, spaced with padding.",        href: "index_Goal_6.html",  c1: "#9333ea", c2: "#f0abfc" },
      { title: "Combining CSS Selectors",       desc: "A to-do list styled with combined selectors.",    href: "index_Goal_7.html",  c1: "#0d9488", c2: "#5eead4" },
      { title: "Positioning",                   desc: "A rectangle with a circle, placed absolutely.",   href: "index_Goal_8.html",  c1: "#e11d48", c2: "#fda4af" },
      { title: "CSS Display (Row)",             desc: "Placing blocks side by side.",                    href: "index_Goal_9.html",  c1: "#0284c7", c2: "#67e8f9" },
      { title: "CSS Display (Column)",          desc: "Stacking blocks vertically.",                     href: "index_Goal_10.html", c1: "#dc2626", c2: "#fb923c" },
      { title: "CatCSS and DogCSS",             desc: "Floating images and text, then clearing.",        href: "index_Goal_11.html", c1: "#db2777", c2: "#f9a8d4" }
    ];

    const viewport = document.getElementById('viewport');
    const track = document.getElementById('track');
    const current = document.getElementById('current');
    const fill = document.getElementById('fill');
    document.getElementById('total').textContent = String(goals.length).padStart(2, '0');

    // ----- Build the cards -----
    goals.forEach((g, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.href;
      a.style.setProperty('--c1', g.c1);
      a.style.setProperty('--c2', g.c2);
      a.innerHTML = `
        <span class="badge">Goal ${i + 1}</span>
        <span class="num">${String(i + 1).padStart(2, '0')}</span>
        <div class="info"><h2>${g.title}</h2><p>${g.desc}</p></div>`;
      track.appendChild(a);
    });
    const cards = [...track.children];

    // ----- Smooth mouse-wheel scrolling -----
    let target = 0, animating = false, snapTimer;
    const maxScroll = () => viewport.scrollWidth - viewport.clientWidth;
    const clamp = v => Math.max(0, Math.min(maxScroll(), v));
    const centerOf = c => c.offsetLeft + c.offsetWidth / 2 - viewport.clientWidth / 2;

    function animate() {
      animating = true;
      const diff = target - viewport.scrollLeft;
      if (Math.abs(diff) < 0.5) { viewport.scrollLeft = target; animating = false; return; }
      viewport.scrollLeft += diff * 0.13;
      requestAnimationFrame(animate);
    }
    function go(v) { target = clamp(v); if (!animating) animate(); }

    function snap() {
      let best = cards[0];
      cards.forEach(c => { if (Math.abs(centerOf(c) - viewport.scrollLeft) < Math.abs(centerOf(best) - viewport.scrollLeft)) best = c; });
      go(centerOf(best));
    }
    const snapLater = () => { clearTimeout(snapTimer); snapTimer = setTimeout(snap, 170); };

    // Vertical wheel movement scrolls the cards sideways
    window.addEventListener('wheel', e => {
      e.preventDefault();
      const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      go((animating ? target : viewport.scrollLeft) + d * 2.2);
      snapLater();
    }, { passive: false });

    // Touch swipes and keyboard arrows still work
    viewport.addEventListener('scroll', () => { if (!animating) { target = viewport.scrollLeft; snapLater(); } update(); }, { passive: true });
    document.addEventListener('keydown', e => {
      const i = cards.findIndex(c => Math.abs(centerOf(c) - target) < 5);
      if (e.key === 'ArrowRight') go(centerOf(cards[Math.min(cards.length - 1, (i < 0 ? 0 : i) + 1)]));
      if (e.key === 'ArrowLeft')  go(centerOf(cards[Math.max(0, (i < 0 ? 0 : i) - 1)]));
    });

    // ----- Focus effect: cards near the centre grow and brighten -----
    function update() {
      const mid = viewport.scrollLeft + viewport.clientWidth / 2;
      let nearest = 0, best = Infinity;
      cards.forEach((c, i) => {
        const dist = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
        const t = Math.min(dist / (c.offsetWidth * 1.1), 1);
        c.style.setProperty('--s', (1 - t * 0.16).toFixed(3));
        c.style.setProperty('--o', (1 - t * 0.45).toFixed(3));
        if (dist < best) { best = dist; nearest = i; }
      });
      current.textContent = String(nearest + 1).padStart(2, '0');
      const max = maxScroll();
      fill.style.width = (max ? (viewport.scrollLeft / max) * 100 : 0) + '%';
    }
    window.addEventListener('resize', () => { target = clamp(target); update(); });
    document.fonts && document.fonts.ready.then(update);
    update();
  </script>
</body>
</html>
