<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Display Property</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    background-color: white;
    margin: 0;
    padding: 20px;
    font-family: Georgia, 'Times New Roman', serif;
  }

  h1 {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: bold;
    margin: 0 0 20px 0;
  }

  .container {
    display: flex;
    flex-direction: column;
    max-width: 300px;
  }

  .box {
    display: block;
    width: 100%;
    height: 280px;
    color: white;
    padding: 8px;
    font-size: 16px;
    margin-bottom: 20px;
  }

  .box:last-child {
    margin-bottom: 0;
  }

  .red {
    background-color: #f91b1e;
  }

  .green {
    background-color: #1c7a1c;
  }

  .blue {
    background-color: #0a3df5;
  }
</style>
</head>
<body>

  <h1>CSS Display Property</h1>

  <div class="container">
    <div class="box red">Red Paragraph</div>
    <div class="box green">Green Paragraph</div>
    <div class="box blue">Blue Paragraph</div>
  </div>

</body>
</html>
